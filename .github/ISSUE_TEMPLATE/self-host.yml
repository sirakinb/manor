# Modified for Manor: product name, setup links, and private security reporting route.
name: Self-host setup
description: Cannot start Manor, run compose, migrate, or build the sandbox
title: "[Self-host]: "
labels:
  - self-host
body:
  - type: markdown
    attributes:
      value: |
        For **security vulnerabilities**, use [Manor's private reporting form](https://github.com/sirakinb/manor/security/advisories/new). See [SECURITY.md](https://github.com/sirakinb/manor/blob/main/SECURITY.md).

        Setup steps are in [README.md](https://github.com/sirakinb/manor/blob/main/README.md). Do not paste `.env` contents or API keys.

  - type: dropdown
    id: step
    attributes:
      label: Which step fails?
      options:
        - Docker Compose / Postgres
        - pnpm install
        - pnpm db:generate or db:migrate
        - pnpm sandbox:build
        - pnpm dev (API, worker, web, or supervisor)
        - Health check / first login
        - Other
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      placeholder: pnpm sandbox:build
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Full terminal output or log excerpt. Redact secrets.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Manor version or commit
      placeholder: main @ abc1234
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: docker
    attributes:
      label: Docker version
      placeholder: Docker Desktop 4.x / docker 27.x
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.x
    validations:
      required: true
